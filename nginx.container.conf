server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml
        font/woff2;

    # Issue relative redirects so the upstream HTTPS scheme is preserved
    # (prevents https -> http downgrade on trailing-slash 301s).
    absolute_redirect off;
    port_in_redirect off;

    location / {
        # Serve per-route /foo/index.html directly (no 301 to add trailing slash),
        # then fall back to SPA shell for unknown routes.
        try_files $uri $uri/index.html $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
